name: busy_network
description: "Jaringan Sibuk — game puzzle jaringan RT/RW Net (Flutter + Flame)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  flame: ^1.38.2
  flutter:
    sdk: flutter
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    # Font Fredoka & Nunito dibundel supaya google_fonts tidak perlu
    # mengunduh saat runtime (offline-friendly, dan test jadi deterministik).
    - assets/google_fonts/
    # Efek suara, disintesis `tool/make_sounds.py`.
    - assets/audio/

